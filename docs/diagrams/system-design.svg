<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="960" height="560" rx="24" fill="#FFF8F6"/>
  <text x="480" y="36" text-anchor="middle" fill="#4A5D23" font-size="22" font-weight="700">One chat turn — LangGraph</text>
  <rect x="330" y="54" width="300" height="48" rx="24" fill="#E3256B"/>
  <text x="480" y="84" text-anchor="middle" fill="#fff" font-weight="700">POST /get or /api/telegram</text>
