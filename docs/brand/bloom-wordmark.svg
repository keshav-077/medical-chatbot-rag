<svg xmlns="http://www.w3.org/2000/svg" width="280" height="76" viewBox="0 0 280 76" role="img" aria-label="bloom Organic Care">
 <rect width="280" height="76" rx="12" fill="#FFF5EE"/>
 <defs>
 <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FF4D8D"/>
 <stop offset="100%" stop-color="#E3256B"/>
 </linearGradient>
 </defs>
 <style>
 .wm-blob { transform-origin: 38px 38px; animation: wm-breathe 4s ease-in-out infinite; }
 .wm-petals { transform-origin: 38px 37px; animation: wm-spin 18s linear infinite; }
 .wm-pulse { stroke-dasharray: 21; animation: wm-pulse 2.4s ease-in-out infinite; }
 @keyframes wm-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
 @keyframes wm-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
 @keyframes wm-pulse { 0%, 100% { stroke-dashoffset: 21; opacity: 0.75; } 50% { stroke-dashoffset: 0; opacity: 1; } }
 </style>
 <g transform="translate(8 8) scale(0.5)">
 <g class="wm-blob">
 <path fill="url(#wm-bg)" d="M60 8c14 0 24 8 30 18 10-2 22 2 28 14 6 12 2 26-6 36 4 12 0 26-10 34-10 8-24 8-36 2-10 8-24 10-36 2-12-8-16-22-12-34-8-10-12-24-6-36 6-12 18-16 28-14C36 16 46 8 60 8z"/>
 </g>
 <g class="wm-petals" opacity="0.22">
 <ellipse cx="60" cy="34" rx="10" ry="18" fill="#fff"/>
 <ellipse cx="60" cy="34" rx="10" ry="18" fill="#fff" transform="rotate(72 60 58)"/>
 <ellipse cx="60" cy="34" rx="10" ry="18" fill="#fff" transform="rotate(144 60 58)"/>
 <ellipse cx="60" cy="34" rx="10" ry="18" fill="#fff" transform="rotate(216 60 58)"/>
 <ellipse cx="60" cy="34" rx="10" ry="18" fill="#fff" transform="rotate(288 60 58)"/>
 </g>
 <path fill="#fff" d="M60 38c-8 0-14 6-14 14 0 10 14 22 14 22s14-12 14-22c0-8-6-14-14-14z"/>
 <path class="wm-pulse" fill="none" stroke="#E3256B" stroke-width="2.2" stroke-linecap="round" d="M44 58h6l3-8 4 16 4-10 3 6h12"/>
 </g>
 <text x="78" y="40" font-family="Quicksand,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#4A5D23">bloom</text>
 <text x="78" y="58" font-family="Quicksand,Segoe UI,sans-serif" font-size="10" font-weight="600" fill="#4A5D23" fill-opacity="0.62" letter-spacing="2.5">ORGANIC CARE</text>
</svg>
