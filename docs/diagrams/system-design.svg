  <text x="480" y="140" text-anchor="middle" fill="#4A5D23" font-weight="700">1. Safety</text>
  <text x="480" y="158" text-anchor="middle" fill="#4A5D23" fill-opacity=".75" font-size="12">Emergency regex first, then InvokeGuardrailChecks</text>
  <path d="M480 170v14" stroke="#4A5D23" stroke-opacity=".45" stroke-width="2"/>
  <rect x="300" y="184" width="360" height="40" rx="12" fill="#fff" stroke="#4A5D23" stroke-opacity=".35"/>
  <text x="480" y="209" text-anchor="middle" fill="#4A5D23" font-weight="600">2. Route — intent + drug catalog</text>
  <path d="M480 224v18" stroke="#4A5D23" stroke-opacity=".45" stroke-width="2"/>
  <g font-size="12" font-weight="600" fill="#4A5D23">
    <rect x="36" y="250" width="140" height="40" rx="10" fill="#FFE4E1"/><text x="106" y="275" text-anchor="middle">general RAG</text>
    <rect x="186" y="250" width="140" height="40" rx="10" fill="#FFE4E1"/><text x="256" y="275" text-anchor="middle">medication</text>
    <rect x="336" y="250" width="140" height="40" rx="10" fill="#FFE4E1"/><text x="406" y="275" text-anchor="middle">symptom + AQI</text>
    <rect x="486" y="250" width="140" height="40" rx="10" fill="#FFE4E1"/><text x="556" y="275" text-anchor="middle">lab PDF</text>
    <rect x="636" y="250" width="140" height="40" rx="10" fill="#FFE4E1"/><text x="706" y="275" text-anchor="middle">care map</text>
    <rect x="786" y="250" width="140" height="40" rx="10" fill="#FFE4E1"/><text x="856" y="275" text-anchor="middle">appointment</text>
  </g>
  <path d="M106 290v16M256 290v16M406 290v16M556 290v16M706 290v16M856 290v16" stroke="#E3256B" stroke-opacity=".35"/>
  <path d="M106 306h750" stroke="#E3256B" stroke-opacity=".35"/>
  <path d="M480 306v16" stroke="#E3256B" stroke-width="2"/>
  <rect x="230" y="322" width="500" height="52" rx="12" fill="#4A5D23"/>
  <text x="480" y="344" text-anchor="middle" fill="#fff" font-weight="700">3. Verify</text>
  <text x="480" y="362" text-anchor="middle" fill="#fff" fill-opacity=".9" font-size="12">Citations, dose strip, output guardrail check</text>
  <path d="M480 374v16" stroke="#4A5D23" stroke-width="2"/>
  <rect x="170" y="390" width="620" height="44" rx="10" fill="#fff" stroke="#E3256B" stroke-width="2"/>
  <text x="480" y="417" text-anchor="middle" fill="#4A5D23" font-weight="600">JSON: answer, citations, risk_level, map_payload, trace_id, guardrail_action</text>
  <rect x="80" y="456" width="800" height="72" rx="12" fill="#fff" stroke="#E3256B" stroke-opacity=".35"/>
  <text x="480" y="484" text-anchor="middle" fill="#E3256B" font-weight="700">Guardrail checkpoints</text>
  <text x="480" y="506" text-anchor="middle" fill="#4A5D23" font-size="13">Input and context are checked before OpenRouter / Groq. The reply is checked again in verify.</text>
</svg>
